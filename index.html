<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SORTLAB | Fluid Matrix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">SORT<span>LAB</span></div>
            
            <div class="section">
                <label>ALGORITHMS (MAX 5)</label>
                <div class="checklist">
                    <label class="item"><input type="checkbox" value="quick" checked> <span>Quick Sort</span></label>
                    <label class="item"><input type="checkbox" value="merge" checked> <span>Merge Sort</span></label>
                    <label class="item"><input type="checkbox" value="insertion" checked> <span>Insertion Sort</span></label>
                    <label class="item"><input type="checkbox" value="selection"> <span>Selection Sort</span></label>
                    <label class="item"><input type="checkbox" value="bubble"> <span>Bubble Sort</span></label>
                </div>
            </div>

            <div class="section">
                <label>SCENARIO</label>
                <div class="btn-stack">
                    <button onclick="genScenario('best')" class="scen-btn">Best Case</button>
                    <button onclick="genScenario('avg')" class="scen-btn active">Average</button>
                    <button onclick="genScenario('worst')" class="scen-btn">Worst Case</button>
                </div>
            </div>

            <div class="section">
                <label>ARRAY SIZE</label>
                <div class="size-btns">
                    <button onclick="setN(20)">20</button>
                    <button onclick="setN(50)">50</button>
                    <button onclick="setN(100)">100</button>
                </div>
            </div>

            <div class="section">
                <label>CUSTOM DATA</label>
                <div class="input-stack">
                    <input type="text" id="customInput" placeholder="e.g. 1, 2, 3, 4">
                    <button onclick="setCustomData()" class="apply-btn">Apply Sequence</button>
                </div>
            </div>

            <div class="section">
                <label>SPEED</label>
                <input type="range" id="speed" min="1" max="200" value="180">
            </div>
        </aside>

        <main class="viewport">
            <header class="header">
                <div id="status">Dynamic Performance Analysis</div>
                <div class="actions">
                    <div class="step-controls">
                        <button onclick="stepBack()" class="icon-btn">Back</button>
                        <button id="pauseBtn" onclick="togglePause()" class="icon-btn">Pause</button>
                        <button onclick="stepForward()" class="icon-btn">Next</button>
                    </div>
                    <button id="resetBtn" class="sec-btn">Reset</button>
                    <button id="playBtn" class="pri-btn">Run Benchmark</button>
                </div>
            </header>

            <div id="matrixGrid" class="matrix-grid">
                </div>
        </main>
    </div>

    <div id="comparisonOverlay" class="comp-overlay">
        <div class="comp-content">
            <h2>Benchmark Analysis</h2>
            <div id="comparisonDetails"></div>
            <button onclick="document.getElementById('comparisonOverlay').style.display='none'" class="pri-btn">Dismiss</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
